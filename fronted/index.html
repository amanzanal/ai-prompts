<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Prompt Optimizer Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center justify-center p-4 selection:bg-indigo-500 selection:text-white">

    <div class="w-full max-w-2xl bg-slate-900 border border-slate-800 rounded-2xl shadow-2xl p-6 sm:p-10 backdrop-blur-xl">
        <header class="mb-8 text-center">
            <h1 class="text-4xl font-black text-transparent bg-clip-text bg-gradient-to-r from-indigo-400 via-sky-400 to-emerald-400">
                Prompt Architect AI
            </h1>
            <p class="text-slate-400 text-sm mt-2">Convierte lenguaje natural en prompts de ingeniería de alto rendimiento.</p>
        </header>

        <form id="prompt-form" class="space-y-6">
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">IA de Destino</label>
                    <select id="target_ai" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3.5 text-slate-200 focus:ring-2 focus:ring-indigo-500 focus:outline-none transition-all">
                        <option value="ChatGPT">ChatGPT</option>
                        <option value="Midjourney">Midjourney</option>
                        <option value="Claude">Claude</option>
                        <option value="DALL-E">DALL-E</option>
                        <option value="Stable Diffusion">Stable Diffusion</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Objetivo Principal</label>
                    <select id="objective" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3.5 text-slate-200 focus:ring-2 focus:ring-indigo-500 focus:outline-none transition-all">
                        <option value="Crear imagen">Crear imagen</option>
                        <option value="Redactar">Redactar</option>
                        <option value="Código">Código</option>
                        <option value="Análisis">Análisis</option>
                    </select>
                </div>
            </div>

            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Tu idea o texto natural</label>
                <textarea id="raw_prompt" rows="3" required placeholder="Ej: un paisaje cyberpunk nocturno..." 
                    class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3.5 text-slate-200 focus:ring-2 focus:ring-indigo-500 focus:outline-none transition-all resize-none"></textarea>
            </div>

            <button type="submit" id="submit-btn" class="w-full bg-gradient-to-r from-indigo-600 to-cyan-600 hover:from-indigo-500 hover:to-cyan-500 transition-all text-white font-bold py-4 rounded-xl shadow-lg shadow-indigo-600/20 active:scale-[0.99]">
                Optimizar Prompt
            </button>
        </form>

        <!-- Sección de Resultado Oculta por defecto -->
        <div id="result-container" class="mt-8 hidden border-t border-slate-800 pt-6 animate-fadeIn">
            <div class="flex justify-between items-center mb-3">
                <h2 class="text-sm font-bold uppercase tracking-wider text-indigo-400">Prompt Profesional Generado</h2>
                <button id="copy-btn" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 font-medium px-3.5 py-2 rounded-lg transition-all border border-slate-700">
                    📋 Copiar prompt
                </button>
            </div>
            <div class="bg-slate-950 border border-slate-800 rounded-xl p-4 font-mono text-xs sm:text-sm text-emerald-400 break-words leading-relaxed" id="output-text"></div>
            <p id="source-text" class="text-[11px] text-slate-500 mt-2 text-right italic"></p>
        </div>
    </div>

    <!-- Importante: type="module" permite usar la arquitectura modular nativa -->
    <script type="module" src="js/app.js"></script>
</body>
</html>
