<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prompt Architect AI - Paso 1</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center justify-center p-4 selection:bg-indigo-500 selection:text-white">

    <div class="w-full max-w-2xl bg-slate-900 border border-slate-800 rounded-2xl shadow-2xl p-6 sm:p-10 backdrop-blur-xl relative">
        
        <!-- Selector de Idioma -->
        <div class="absolute top-6 right-6">
            <select id="lang-selector" class="bg-slate-950 border border-slate-700 text-xs rounded-lg px-2.5 py-1.5 text-slate-300 focus:outline-none focus:ring-1 focus:ring-indigo-500">
                <option value="es">ES</option>
                <option value="en">EN</option>
            </select>
        </div>

        <header class="mb-8 text-center pr-12">
            <h1 id="app-title" class="text-3xl sm:text-4xl font-black text-transparent bg-clip-text bg-gradient-to-r from-indigo-400 via-sky-400 to-emerald-400">
                Prompt Architect AI
            </h1>
            <p id="app-subtitle" class="text-slate-400 text-sm mt-2">Convierte lenguaje natural en prompts de alto rendimiento.</p>
        </header>

        <div class="space-y-6">
            <h2 id="step1-title" class="text-lg font-semibold text-indigo-400 mb-4">1. ¿Qué deseas hacer?</h2>
            
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <button type="button" class="objective-card p-5 rounded-xl border border-slate-700 bg-slate-950 hover:border-indigo-500 hover:bg-slate-800 transition-all text-left group" data-objective="Redactar">
                    <div class="text-2xl mb-2">✍️</div>
                    <h3 id="obj-redactar-title" class="font-bold text-slate-200 group-hover:text-indigo-400">Redactar</h3>
                    <p id="obj-redactar-desc" class="text-xs text-slate-400 mt-1">Correos, artículos, resúmenes, estructuras.</p>
                </button>

                <button type="button" class="objective-card p-5 rounded-xl border border-slate-700 bg-slate-950 hover:border-indigo-500 hover:bg-slate-800 transition-all text-left group" data-objective="Código">
                    <div class="text-2xl mb-2">💻</div>
                    <h3 id="obj-codigo-title" class="font-bold text-slate-200 group-hover:text-indigo-400">Código</h3>
                    <p id="obj-codigo-desc" class="text-xs text-slate-400 mt-1">Funciones, refactorización, debugging, tests.</p>
                </button>

                <button type="button" class="objective-card p-5 rounded-xl border border-slate-700 bg-slate-950 hover:border-indigo-500 hover:bg-slate-800 transition-all text-left group" data-objective="Crear imagen">
                    <div class="text-2xl mb-2">🎨</div>
                    <h3 id="obj-imagen-title" class="font-bold text-slate-200 group-hover:text-indigo-400">Crear Imagen</h3>
                    <p id="obj-imagen-desc" class="text-xs text-slate-400 mt-1">Generación, ilustración, estilos fotorrealistas.</p>
                </button>

                <button type="button" class="objective-card p-5 rounded-xl border border-slate-700 bg-slate-950 hover:border-indigo-500 hover:bg-slate-800 transition-all text-left group" data-objective="Análisis">
                    <div class="text-2xl mb-2">📊</div>
                    <h3 id="obj-analisis-title" class="font-bold text-slate-200 group-hover:text-indigo-400">Análisis</h3>
                    <p id="obj-analisis-desc" class="text-xs text-slate-400 mt-1">Datos, métricas, auditorías de textos o lógica.</p>
                </button>
            </div>
        </div>
    </div>

    <script type="module" src="js/indexApp.js"></script>
</body>
</html>
