<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prompt Architect AI - Paso 2</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center justify-center p-4 selection:bg-indigo-500 selection:text-white">

    <div class="w-full max-w-2xl bg-slate-900 border border-slate-800 rounded-2xl shadow-2xl p-6 sm:p-10 backdrop-blur-xl relative">
        
        <!-- Selector de Idioma -->
        <div class="absolute top-6 right-6">
            <select id="lang-selector" class="bg-slate-950 border border-slate-700 text-xs rounded-lg px-2.5 py-1.5 text-slate-300 focus:outline-none focus:ring-1 focus:ring-indigo-500">
                <option value="es">ES</option>
                <option value="en">EN</option>
            </select>
        </div>

        <header class="mb-6 text-center pr-12">
            <h1 id="app-title" class="text-3xl font-black text-transparent bg-clip-text bg-gradient-to-r from-indigo-400 via-sky-400 to-emerald-400">
                Prompt Architect AI
            </h1>
        </header>

        <form id="step2-form" class="space-y-5">
            <div class="flex items-center justify-between border-b border-slate-800 pb-3">
                <h2 id="details-title" class="text-lg font-semibold text-indigo-400">2. Detalles específicos</h2>
                <a href="index.html" id="back-link" class="text-xs text-slate-400 hover:text-slate-200 underline">← Cambiar objetivo</a>
            </div>

            <!-- Registro / Tono (Formal, Informal, Neutro) -->
            <div>
                <label id="register-label" class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Registro de Lenguaje</label>
                <select id="language_register" class="w-full bg-slate-950 border border-slate-700 rounded-xl p-3.5 text-slate-200 focus:ring-2 focus:ring-indigo-500">
                    <option value="Formal" id="reg-formal">Formal / Corporativo</option>
                    <option value="Informal" id="reg-informal">Informal / Cercano</option>
                    <option value="Neutro" id="reg-neutral">Neutro / Técnico</option>
                </select>
            </div>

            <!-- Contenedor inyectado dinámicamente según objetivo -->
            <div id="dynamic-fields" class="space-y-4"></div>

            <!-- Selector de IA Destino -->
            <div>
                <label id="target-ai-label" class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">IA de Destino</label>
                <select id="target_ai" class="w-full bg-slate-950 border border-slate-700 rounded-xl p-3.5 text-slate-200 focus:ring-2 focus:ring-indigo-500">
                    <option value="ChatGPT">ChatGPT</option>
                    <option value="Midjourney">Midjourney</option>
                    <option value="Claude">Claude</option>
                    <option value="DALL-E">DALL-E</option>
                    <option value="Stable Diffusion">Stable Diffusion</option>
                </select>
            </div>

            <button type="submit" id="submit-btn" class="w-full bg-gradient-to-r from-indigo-600 to-cyan-600 hover:from-indigo-500 hover:to-cyan-500 transition-all text-white font-bold py-4 rounded-xl shadow-lg shadow-indigo-600/20">
                Optimizar Prompt Profesional
            </button>
        </form>

        <!-- SECCIÓN DE RESULTADO -->
        <div id="result-container" class="mt-8 hidden border-t border-slate-800 pt-6">
            <div class="flex justify-between items-center mb-3">
                <h2 id="result-title" class="text-sm font-bold uppercase tracking-wider text-indigo-400">Prompt Profesional Generado</h2>
                <button id="copy-btn" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 font-medium px-3.5 py-2 rounded-lg transition-all border border-slate-700">
                    📋 Copiar prompt
                </button>
            </div>
            <div class="bg-slate-950 border border-slate-800 rounded-xl p-4 font-mono text-xs sm:text-sm text-emerald-400 break-words leading-relaxed" id="output-text"></div>
            <p id="source-text" class="text-[11px] text-slate-500 mt-2 text-right italic"></p>
        </div>
    </div>

    <script type="module" src="js/step2App.js"></script>
</body>
</html>
